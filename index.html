<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>在庫管理 Ver.1.3</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    input, button {
      font-size: 18px;
      padding: 10px;
      margin: 5px 0;
    }

    input {
      width: 90%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    .version {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #status {
      margin: 15px 0;
      padding: 10px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .product {
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .product button {
      font-size: 14px;
      padding: 6px 10px;
    }
  </style>
</head>

<body>

  <h1>📦 在庫管理</h1>

  <div class="version">
    在庫管理 Ver.1.3
  </div>

  <button onclick="startScanner()">
    📷 バーコードを読み取る
  </button>

  <div id="reader" style="width:100%; margin-top:15px;"></div>

  <div id="status">
    待機中
  </div>

  <hr>

  <h2>商品登録</h2>

  <label>バーコード</label><br>
  <input
    id="barcode"
    placeholder="バーコード番号"
  >

  <br>

  <label>商品名</label><br>
  <input
    id="name"
    placeholder="商品名"
  >

  <br>

  <label>在庫数</label><br>
  <input
    id="stock"
    type="number"
    value="1"
    min="0"
  >

  <br>

  <button onclick="addProduct()">
    商品を登録
  </button>

  <h2>商品一覧</h2>

  <div id="list"></div>


<script>

  /*
   * =========================
   * 在庫データ
   * =========================
   */

  let scanner = null;

  let products =
    JSON.parse(
      localStorage.getItem("products")
    ) || [];

  displayProducts();


  /*
   * =========================
   * バーコード読み取り
   * =========================
   */

  function startScanner() {

    if (scanner) {
      return;
    }

    document.getElementById("status").textContent =
      "📷 カメラ起動中…";

    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 150
        }
      },


      function(decodedText) {

        /*
         * バーコード取得
         */

        document.getElementById("barcode").value =
          decodedText;


        /*
         * 検索開始
         */

        document.getElementById("status").textContent =
          "🔍 商品情報を検索中…";


        /*
         * カメラ停止を待たず検索
         */

        stopScanner();


        lookupProduct(decodedText);

      },


      function(errorMessage) {

        /*
         * 読み取り途中のエラーは無視
         */

      }

    ).catch(function(error) {

      document.getElementById("status").textContent =
        "❌ カメラを起動できませんでした";

      scanner = null;

      console.log(error);

    });

  }


  /*
   * =========================
   * カメラ停止
   * =========================
   */

  async function stopScanner() {

    if (!scanner) {
      return;
    }

    const currentScanner = scanner;

    scanner = null;

    try {

      await currentScanner.stop();

      currentScanner.clear();

    } catch (error) {

      console.log(
        "カメラ停止エラー:",
        error
      );

    }

  }


  /*
   * =========================
   * 商品情報検索
   * Open Food Facts API v3
   * =========================
   */

  async function lookupProduct(barcode) {

    const status =
      document.getElementById("status");


    status.textContent =
      "🔍 商品情報を検索中…";


    /*
     * Open Food Facts v3
     *
     * バーコードをそのままURLに入れる
     */

    const url =
      "https://world.openfoodfacts.org/api/v3/product/"
      + encodeURIComponent(barcode);


    try {

      console.log(
        "API URL:",
        url
      );


      const response =
        await fetch(url);


      console.log(
        "HTTPステータス:",
        response.status
      );


      /*
       * 404 = 商品が登録されていない
       */

      if (response.status === 404) {

        status.textContent =
          "⚠️ このJANの商品情報は登録されていません\n"
          + "JAN：" + barcode;

        return;
      }


      /*
       * その他のHTTPエラー
       */

      if (!response.ok) {

        status.textContent =
          "❌ APIエラー\n"
          + "HTTP " + response.status;

        return;
      }


      /*
       * JSON取得
       */

      const data =
        await response.json();


      console.log(
        "API結果:",
        data
      );


      /*
       * v3では成功時にproductが返る
       */

      if (
        data.product
      ) {

        const product =
          data.product;


        /*
         * 商品名候補
         */

        const name =
          product.product_name_ja ||
          product.product_name ||
          product.product_name_en ||
          "";


        /*
         * 商品名が見つかった
         */

        if (name) {

          document.getElementById("name").value =
            name;


          status.textContent =
            "✅ 商品名を取得しました\n"
            + name;


        } else {

          status.textContent =
            "⚠️ 商品は見つかりましたが、商品名が登録されていません";

        }


      } else {

        status.textContent =
          "⚠️ 商品情報が見つかりませんでした";

      }


    } catch (error) {

      console.error(
        "商品検索エラー:",
        error
      );


      status.textContent =
        "❌ 商品情報の取得に失敗しました\n"
        + error.message;

    }

  }


  /*
   * =========================
   * 商品登録
   * =========================
   */

  function addProduct() {

    const barcode =
      document
        .getElementById("barcode")
        .value
        .trim();


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const stock =
      Number(
        document
          .getElementById("stock")
          .value
      );


    if (!barcode) {

      alert(
        "バーコードを入力してください"
      );

      return;
    }


    if (!name) {

      alert(
        "商品名を入力してください"
      );

      return;
    }


    /*
     * 同じJANがあるか確認
     */

    const existing =
      products.find(
        product =>
          product.barcode === barcode
      );


    if (existing) {

      existing.stock += stock;

    } else {

      products.push({

        barcode: barcode,

        name: name,

        stock: stock

      });

    }


    saveProducts();

    displayProducts();


    /*
     * 入力欄をリセット
     */

    document.getElementById("barcode").value =
      "";

    document.getElementById("name").value =
      "";

    document.getElementById("stock").value =
      1;


    document.getElementById("status").textContent =
      "✅ 商品を登録しました";

  }


  /*
   * =========================
   * 在庫増減
   * =========================
   */

  function changeStock(index, amount) {

    products[index].stock += amount;


    if (products[index].stock < 0) {

      products[index].stock = 0;

    }


    saveProducts();

    displayProducts();

  }


  /*
   * =========================
   * 商品削除
   * =========================
   */

  function deleteProduct(index) {

    if (
      !confirm(
        "この商品を削除しますか？"
      )
    ) {

      return;
    }


    products.splice(index, 1);

    saveProducts();

    displayProducts();

  }


  /*
   * =========================
   * 保存
   * =========================
   */

  function saveProducts() {

    localStorage.setItem(
      "products",
      JSON.stringify(products)
    );

  }


  /*
   * =========================
   * 商品一覧表示
   * =========================
   */

  function displayProducts() {

    const list =
      document.getElementById("list");


    list.innerHTML = "";


    if (products.length === 0) {

      list.innerHTML =
        "<p>まだ商品がありません。</p>";

      return;

    }


    products.forEach(
      function(product, index) {

        const div =
          document.createElement("div");


        div.className =
          "product";


        div.innerHTML = `

          <strong>
            ${escapeHtml(product.name)}
          </strong>

          <br>

          JAN：
          ${escapeHtml(product.barcode)}

          <br>

          在庫：
          <strong>
            ${product.stock}
          </strong>
          個

          <br>

          <button
            onclick="changeStock(${index}, 1)"
          >
            ＋1
          </button>

          <button
            onclick="changeStock(${index}, -1)"
          >
            −1
          </button>

          <button
            onclick="deleteProduct(${index})"
          >
            削除
          </button>

        `;


        list.appendChild(div);

      }
    );

  }


  /*
   * =========================
   * HTMLエスケープ
   * =========================
   */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }

</script>

</body>
</html>
