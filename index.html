<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫管理</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input, button {
      font-size: 18px;
      padding: 10px;
      margin: 5px 0;
    }

    input {
      width: 90%;
    }

    .product {
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    #status {
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📦 在庫管理</h1>

<button onclick="startScanner()">📷 バーコードを読み取る</button>

<div id="reader" style="width:100%; margin-top:15px;"></div>

<div id="status"></div>

<hr>

<h2>商品登録</h2>

<label>バーコード</label><br>
<input id="barcode" placeholder="バーコード番号">

<br>

<label>商品名</label><br>
<input id="name" placeholder="商品名">

<br>

<label>在庫数</label><br>
<input id="stock" type="number" value="1" min="0">

<br>

<button onclick="addProduct()">商品を登録</button>

<h2>商品一覧</h2>

<div id="list"></div>

<script>

let scanner = null;

let products =
  JSON.parse(localStorage.getItem("products")) || [];

displayProducts();


/* -------------------------
   バーコード読み取り
------------------------- */

function startScanner() {

  if (scanner) return;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 280,
        height: 150
      }
    },

async (decodedText) => {

  document.getElementById("barcode").value = decodedText;

  document.getElementById("status").textContent =
    "✅ 読み取り成功： " + decodedText;

  await stopScanner();

},

    () => {
      // 読み取り中のエラーは無視
    }

  ).catch(error => {

    alert(
      "カメラを起動できませんでした。\n" +
      error
    );

    scanner = null;
  });
}


/* -------------------------
   カメラ停止
------------------------- */

async function stopScanner() {

  if (!scanner) return;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {
    console.log(e);
  }

  scanner = null;
}


/* -------------------------
   商品情報検索
------------------------- */

async function lookupProduct(barcode) {

  const status =
    document.getElementById("status");

  status.textContent =
    "🔍 商品情報を検索しています…";

  try {

    const url =
      `https://world.openfoodfacts.org/api/v3/product/${encodeURIComponent(barcode)}.json`;

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("APIエラー");
    }

    const data =
      await response.json();

    if (
      data.status === 1 &&
      data.product
    ) {

      const product =
        data.product;

      // 商品名候補
      const name =
        product.product_name_ja ||
        product.product_name ||
        product.product_name_en ||
        "";

      if (name) {

        document.getElementById("name").value =
          name;

        status.textContent =
          "✅ 商品情報を取得しました";

      } else {

        status.textContent =
          "⚠️ 商品は見つかりましたが商品名がありません。手入力してください。";
      }

    } else {

      status.textContent =
        "⚠️ 商品情報が見つかりませんでした。商品名を手入力してください。";
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "⚠️ 商品情報を取得できませんでした。商品名を手入力してください。";
  }
}


/* -------------------------
   商品登録
------------------------- */

function addProduct() {

  const barcode =
    document.getElementById("barcode")
      .value.trim();

  const name =
    document.getElementById("name")
      .value.trim();

  const stock =
    Number(
      document.getElementById("stock").value
    );

  if (!barcode) {
    alert("バーコードを入力してください");
    return;
  }

  if (!name) {
    alert("商品名を入力してください");
    return;
  }

  const existing =
    products.find(
      product =>
        product.barcode === barcode
    );

  if (existing) {

    existing.stock += stock;

  } else {

    products.push({
      barcode,
      name,
      stock
    });
  }

  saveProducts();
  displayProducts();

  document.getElementById("barcode").value = "";
  document.getElementById("name").value = "";
  document.getElementById("stock").value = 1;
  document.getElementById("status").textContent = "";
}


/* -------------------------
   在庫増減
------------------------- */

function changeStock(index, amount) {

  products[index].stock += amount;

  if (products[index].stock < 0) {
    products[index].stock = 0;
  }

  saveProducts();
  displayProducts();
}


/* -------------------------
   商品削除
------------------------- */

function deleteProduct(index) {

  if (!confirm("この商品を削除しますか？")) {
    return;
  }

  products.splice(index, 1);

  saveProducts();
  displayProducts();
}


/* -------------------------
   保存
------------------------- */

function saveProducts() {

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );
}


/* -------------------------
   一覧表示
------------------------- */

function displayProducts() {

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  if (products.length === 0) {

    list.innerHTML =
      "<p>まだ商品がありません。</p>";

    return;
  }

  products.forEach((product, index) => {

    const div =
      document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <strong>${escapeHtml(product.name)}</strong><br>
      JAN：${escapeHtml(product.barcode)}<br>
      在庫：<strong>${product.stock}</strong>個<br>

      <button onclick="changeStock(${index}, 1)">
        ＋1
      </button>

      <button onclick="changeStock(${index}, -1)">
        −1
      </button>

      <button onclick="deleteProduct(${index})">
        削除
      </button>
    `;

    list.appendChild(div);
  });
}


/* -------------------------
   HTMLエスケープ
------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
