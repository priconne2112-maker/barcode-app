<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫管理</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background-color: #f9f9f9;
    }

    .mode-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 6px;
    }

    .mode-btn.active-in {
      background: #e6f4ea;
      border-color: #34a853;
      color: #137333;
    }

    .mode-btn.active-out {
      background: #fce8e6;
      border-color: #ea4335;
      color: #c5221f;
    }

    input, button {
      font-size: 16px;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
    }

    input {
      width: 90%;
      border: 1px solid #ccc;
    }

    .btn-main {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .product {
      border: 1px solid #ccc;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      background: #fff;
    }

    #status {
      margin: 10px 0;
      font-weight: bold;
      padding: 8px;
      border-radius: 4px;
    }

    .status-ok { background: #e6f4ea; color: #137333; }
    .status-warn { background: #fce8e6; color: #c5221f; }
    
    #reg-box {
      border: 2px solid #1a73e8;
      background: #e8f0fe;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<h1>📦 在庫管理スキャナー</h1>

<!-- モード切り替え -->
<div class="mode-container">
  <button id="btn-in" class="mode-btn active-in" onclick="setMode('in')">📥 入庫 (+1)</button>
  <button id="btn-out" class="mode-btn" onclick="setMode('out')">📤 出庫 (-1)</button>
</div>

<button class="btn-main" onclick="startScanner()">📷 バーコードを読み取る</button>

<div id="reader" style="width:100%; margin-top:15px;"></div>

<div id="status"></div>

<!-- 辞書未登録時の登録フォーム -->
<div id="reg-box" style="display:none;">
  <h3>⚠️ 辞書未登録の商品です</h3>
  <p>バーコード: <strong id="target-barcode"></strong></p>
  <label>商品名を入力して辞書登録してください</label><br>
  <input id="reg-name" placeholder="例: お茶 500ml"><br>
  <button class="btn-main" onclick="registerProduct()">辞書に保存して処理</button>
</div>

<hr>

<h2>商品一覧（クラウド同期）</h2>
<button onclick="loadStockList()" style="width:100%;">🔄 在庫一覧を更新</button>

<div id="list"></div>

<script>

// ★取得したGASのWebアプリURLを以下に貼り付けてください
const GAS_URL = "https://script.google.com/macros/s/AKfycbxIY1NMn3ry3EOdP4olMb7d0SIJx2nr58l25k7u7J-ZfpRUZfy6FbgwAOaVhcaf7qKG/exec";

let scanner = null;
let currentMode = "in";
let pendingBarcode = "";
let isProcessing = false;

// 初期表示時に在庫一覧を取得
loadStockList();

/* -------------------------
   モード切り替え
------------------------- */
function setMode(mode) {
  currentMode = mode;
  document.getElementById("btn-in").className = "mode-btn " + (mode === "in" ? "active-in" : "");
  document.getElementById("btn-out").className = "mode-btn " + (mode === "out" ? "active-out" : "");
}

/* -------------------------
   ステータス表示
------------------------- */
function setStatus(text, isError = false) {
  const status = document.getElementById("status");
  status.textContent = text;
  status.className = isError ? "status-warn" : "status-ok";
}

/* -------------------------
   バーコード読み取り（カメラ）
------------------------- */
function startScanner() {
  if (scanner) return;

  document.getElementById("reg-box").style.display = "none";
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 280, height: 150 }
    },
    async (decodedText) => {
      if (isProcessing) return;
      isProcessing = true;

      setStatus("⏳ 処理中...: " + decodedText);

      // カメラを自動停止
      await stopScanner();

      // GASへ通信して処理（辞書照会・自動増減）
      handleScan(decodedText);
    },
    () => {}
  ).catch(error => {
    alert("カメラを起動できませんでした。\n" + error);
    scanner = null;
  });
}

async function stopScanner() {
  if (!scanner) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {
    console.log(e);
  }
  scanner = null;
}

/* -------------------------
   スキャン後のGAS連携処理
------------------------- */
function handleScan(barcode) {
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "scan",
      barcode: barcode,
      mode: currentMode
    })
  })
  .then(res => res.json())
  .then(data => {
    isProcessing = false;
    if (data.success) {
      const actionText = data.mode === "in" ? "【入庫 +1】" : "【出庫 -1】";
      setStatus(`✅ ${actionText} ${data.name}（現在の在庫: ${data.stock}個）`);
      loadStockList();
    } else if (data.reason === "not_found") {
      setStatus("⚠️ 辞書未登録のバーコードです。下記から登録してください。", true);
      pendingBarcode = data.barcode;
      document.getElementById("target-barcode").textContent = pendingBarcode;
      document.getElementById("reg-box").style.display = "block";
    }
  })
  .catch(err => {
    isProcessing = false;
    console.error(err);
    setStatus("❌ 通信エラーが発生しました", true);
  });
}

/* -------------------------
   辞書への新規登録＆同時に在庫更新処理
------------------------- */
function registerProduct() {
  const name = document.getElementById("reg-name").value.trim();
  if (!name) {
    alert("商品名を入力してください");
    return;
  }

  setStatus("⏳ 辞書登録と在庫更新を実行中…");

  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "registerAndScan",
      barcode: pendingBarcode,
      name: name,
      mode: currentMode
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      const actionText = data.mode === "in" ? "【入庫 +1】" : "【出庫 -1】";
      setStatus(`✅ 辞書登録完了！ ${actionText} ${data.name}（現在の在庫: ${data.stock}個）`);
      document.getElementById("reg-box").style.display = "none";
      document.getElementById("reg-name").value = "";
      loadStockList();
    }
  })
  .catch(err => {
    console.error(err);
    setStatus("❌ 登録エラーが発生しました", true);
  });
}

/* -------------------------
   在庫一覧の取得（スプレッドシートから）
------------------------- */
function loadStockList() {
  const list = document.getElementById("list");
  
  fetch(GAS_URL + "?action=getAll")
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      displayProducts(data.items);
    }
  })
  .catch(err => {
    console.error(err);
    list.innerHTML = "<p>在庫データの取得に失敗しました</p>";
  });
}

/* -------------------------
   一覧表示レンダリング
------------------------- */
function displayProducts(products) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!products || products.length === 0) {
    list.innerHTML = "<p>まだ在庫データがありません。</p>";
    return;
  }

  products.forEach(product => {
    const div = document.createElement("div");
    div.className = "product";
    div.innerHTML = `
      <strong>${escapeHtml(product.name)}</strong><br>
      JAN：${escapeHtml(product.barcode)}<br>
      在庫：<strong>${product.stock}</strong>個
    `;
    list.appendChild(div);
  });
}

/* -------------------------
   HTMLエスケープ
------------------------- */
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
</html>
